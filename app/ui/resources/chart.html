<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1e222d;overflow:hidden;font-family:'Segoe UI',sans-serif}
  #container{position:relative;width:100vw;height:100vh}
  #chart{width:100%;height:100%}
  #draw-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
  #info-overlay{position:absolute;top:8px;left:12px;z-index:10;color:#d1d4dc;font-size:14px;
    pointer-events:none;background:rgba(30,34,45,0.92);border:1px solid #3d3d5c;
    border-radius:4px;padding:8px 12px;min-width:175px;line-height:1.7;display:none}
  #info-overlay.visible{display:block}
  .info-date{color:#808899;font-size:14px;border-bottom:1px solid #2B2B43;padding-bottom:3px;margin-bottom:2px}
  .info-row{display:flex;justify-content:space-between;gap:10px}
  .info-label{color:#808899}.info-val{font-weight:600;font-variant-numeric:tabular-nums}
  .up{color:#ef5350}.down{color:#26a69a}
  #toolbar{position:absolute;top:8px;right:12px;z-index:15;display:flex;gap:3px}
  #toolbar button{background:#2B2B43;color:#d1d4dc;border:1px solid #3d3d5c;padding:5px 10px;font-size:14px;cursor:pointer;border-radius:3px}
  #toolbar button:hover{background:#3d3d5c}
  #toolbar button.active{background:#5b5bff;border-color:#7b7bff}
</style>
</head>
<body>
<div id="container">
  <div id="info-overlay"></div>
  <div id="toolbar">
    <button onclick="setDrawMode('none')" id="tb-none" class="active">指针</button>
    <button onclick="setDrawMode('hline')" id="tb-hline">水平线</button>
    <button onclick="setDrawMode('rect')" id="tb-rect">矩形</button>
    <button onclick="setDrawMode('rr')" id="tb-rr">盈亏比</button>
    <button onclick="setDrawMode('channel')" id="tb-channel">通道</button>
    <button onclick="undoDrawing()">撤销</button>
    <button onclick="clearDrawings()">清除</button>
  </div>
  <div id="chart"></div>
  <canvas id="draw-canvas"></canvas>
</div>
<script src="lightweight-charts.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
/* ================================================================
   CHART CORE + MA
   ================================================================ */
var chart, candleSeries, volumeSeries, maSeries, bridge;

function initChart(){
  chart=LightweightCharts.createChart(document.getElementById('chart'),{
    layout:{background:{type:'solid',color:'#1e222d'},textColor:'#d1d4dc'},
    grid:{vertLines:{color:'#2B2B43'},horzLines:{color:'#2B2B43'}},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    rightPriceScale:{
      borderColor:'#2B2B43',
      autoScale:true,
      scaleMargins:{top:0.12,bottom:0.1},
    },
    timeScale:{borderColor:'#2B2B43',timeVisible:true,secondsVisible:false},
    width:window.innerWidth,height:window.innerHeight,
  });
  candleSeries=chart.addCandlestickSeries({
    upColor:'#ef5350',downColor:'#26a69a',
    borderUpColor:'#ef5350',borderDownColor:'#26a69a',
    wickUpColor:'#ef5350',wickDownColor:'#26a69a',
  });
  volumeSeries=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'volume'});
  chart.priceScale('volume').applyOptions({scaleMargins:{top:0.8,bottom:0}});

  maSeries=chart.addLineSeries({
    color:'#e0e040',lineWidth:1.5,
    priceLineVisible:false,lastValueVisible:true,
    crosshairMarkerVisible:false,title:'MA20',
    lineType:0,
  });

  chart.subscribeCrosshairMove(function(p){
    var ov=document.getElementById('info-overlay');
    if(!p||!p.time){ov.classList.remove('visible');return}
    var d=p.seriesData.get(candleSeries);
    if(!d){ov.classList.remove('visible');return}
    var c=d.close>=d.open?'up':'down';
    var key=typeof p.time==='object'?(p.time.year+'-'+String(p.time.month).padStart(2,'0')+'-'+String(p.time.day).padStart(2,'0')):String(p.time);
    var ex=_extraData[key]||{};
    var dateStr=ex.date||key;
    var wdStr=ex.weekday||'';
    var timeStr=ex.time||'';
    var chg=ex.change||0, chgPct=ex.changePct||0;
    var chgCls=chg>=0?'up':'down';
    var vol=ex.volume||0, to=ex.turnover||0;
    var maVal=p.seriesData.get(maSeries);
    var h='<div class="info-date">'+dateStr+' '+wdStr+(timeStr?' '+timeStr:'')+'</div>';
    h+='<div class="info-row"><span class="info-label">开盘</span><span class="info-val '+c+'">'+d.open.toFixed(2)+'</span></div>';
    h+='<div class="info-row"><span class="info-label">收盘</span><span class="info-val '+c+'">'+d.close.toFixed(2)+'</span></div>';
    h+='<div class="info-row"><span class="info-label">最高</span><span class="info-val '+c+'">'+d.high.toFixed(2)+'</span></div>';
    h+='<div class="info-row"><span class="info-label">最低</span><span class="info-val '+c+'">'+d.low.toFixed(2)+'</span></div>';
    h+='<div class="info-row"><span class="info-label">涨跌</span><span class="info-val '+chgCls+'">'+(chg>=0?'+':'')+chg.toFixed(2)+'</span></div>';
    h+='<div class="info-row"><span class="info-label">涨幅</span><span class="info-val '+chgCls+'">'+(chgPct>=0?'+':'')+chgPct.toFixed(2)+'%</span></div>';
    h+='<div class="info-row"><span class="info-label">成交量</span><span class="info-val">'+fmtVol(vol)+'</span></div>';
    if(to>0) h+='<div class="info-row"><span class="info-label">成交额</span><span class="info-val">'+fmtVol(to)+'</span></div>';
    if(maVal) h+='<div class="info-row"><span class="info-label">MA20</span><span class="info-val" style="color:#e0e040">'+maVal.value.toFixed(2)+'</span></div>';
    ov.innerHTML=h;ov.classList.add('visible');
  });
  chart.timeScale().subscribeVisibleLogicalRangeChange(renderAll);
}
initChart();

new QWebChannel(qt.webChannelTransport,function(ch){
  bridge=ch.objects.bridge;
  if(bridge)bridge.chartReady();
});

/* ================================================================
   EXTRA DATA (volume, turnover, change …)
   ================================================================ */
var _extraData={};
function setExtraData(obj){_extraData=obj||{}}
function addExtraPoint(key,obj){_extraData[key]=obj}
function fmtVol(v){
  if(v>=1e8)return(v/1e8).toFixed(2)+'亿';
  if(v>=1e4)return(v/1e4).toFixed(2)+'万';
  return v.toFixed(0);
}

/* ================================================================
   DATA API
   ================================================================ */
/** 恢复右侧价格轴自动缩放（滚轮缩放后会关掉 autoScale，换股票后必须重置，否则 K 线挤在底部） */
function resetMainPriceScaleAutoCenter(){
  if(!chart)return;
  var m={top:0.14,bottom:0.12};
  try{
    chart.priceScale('right').applyOptions({autoScale:true,scaleMargins:m});
  }catch(e0){}
  try{
    if(candleSeries&&candleSeries.priceScale){
      candleSeries.priceScale().applyOptions({autoScale:true,scaleMargins:m});
    }
  }catch(e1){}
}
function setData(candles,volumes){
  if(!candleSeries)return;
  resetMainPriceScaleAutoCenter();
  if(maSeries)maSeries.setData([]);
  candleSeries.setData(candles);volumeSeries.setData(volumes);
  if(candles&&candles.length){
    chart.timeScale().fitContent();
    requestAnimationFrame(function(){
      resetMainPriceScaleAutoCenter();
    });
  }
}
/** 切换股票后 WebEngine 布局稳定后再居中一次（避免首帧宽度为 0 导致看不见 K 线） */
function fitCenterVisibleBarCount(n){
  if(!chart||!candleSeries||!n)return;
  resetMainPriceScaleAutoCenter();
  chart.timeScale().fitContent();
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      resetMainPriceScaleAutoCenter();
      try{
        var want=Math.min(n,Math.max(35,Math.round(n*0.72)));
        var from=Math.max(0,(n-want)/2);
        var to=from+want-1;
        chart.timeScale().setVisibleLogicalRange({from:from,to:to});
      }catch(e){
        chart.timeScale().fitContent();
      }
      requestAnimationFrame(function(){ resetMainPriceScaleAutoCenter(); });
    });
  });
}
/** 延迟再跑一次：MA 与布局都就绪后修正价格轴 + 时间轴 */
function refitAfterStockSwitch(n){
  resetMainPriceScaleAutoCenter();
  fitCenterVisibleBarCount(n|0);
}
/** 全量替换 K 线并让「中间大部分 K 线」落在视窗中央（切换股票等场景） */
function setDataCentered(candles,volumes,extra){
  _extraData=extra||{};
  if(!candleSeries)return;
  resetMainPriceScaleAutoCenter();
  if(maSeries)maSeries.setData([]);
  candleSeries.setData(candles||[]);volumeSeries.setData(volumes||[]);
  if(!candles||!candles.length)return;
  var n=candles.length;
  chart.timeScale().fitContent();
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      resetMainPriceScaleAutoCenter();
      try{
        var want=Math.min(n,Math.max(35,Math.round(n*0.72)));
        var from=Math.max(0,(n-want)/2);
        var to=from+want-1;
        chart.timeScale().setVisibleLogicalRange({from:from,to:to});
      }catch(e){
        chart.timeScale().fitContent();
      }
      requestAnimationFrame(function(){ resetMainPriceScaleAutoCenter(); });
    });
  });
}
function addCandle(candle,volume){
  if(!candleSeries)return;
  candleSeries.update(candle);volumeSeries.update(volume);
}
function setMAData(data){
  if(maSeries)maSeries.setData(data||[]);
  requestAnimationFrame(function(){
    resetMainPriceScaleAutoCenter();
    requestAnimationFrame(function(){ resetMainPriceScaleAutoCenter(); });
  });
}
function addMAPoint(pt){ if(maSeries)maSeries.update(pt); }
function setMarkers(m){ if(candleSeries)candleSeries.setMarkers(m); }
function getDrawingsJSON(){ return JSON.stringify(drawings||[]); }
function setDrawingsJSON(payload){
  try{
    drawings=payload?JSON.parse(payload):[];
    selectedIdx=-1;currentDraw=null;dragOffset=null;channelEdgeDrag=null;
    renderAll();
  }catch(err){
    drawings=[];renderAll();
  }
}
function clearChart(){
  resetMainPriceScaleAutoCenter();
  if(candleSeries)candleSeries.setData([]);
  if(volumeSeries)volumeSeries.setData([]);
  if(maSeries)maSeries.setData([]);
  resetMainPriceScaleAutoCenter();
}
function fitContent(){if(chart)chart.timeScale().fitContent()}

/* ================================================================
   COORDINATES
   ================================================================ */
function priceToY(p){return candleSeries?candleSeries.priceToCoordinate(p):null}
function yToPrice(y){return candleSeries?candleSeries.coordinateToPrice(y):null}
function timeToX(l){return chart?chart.timeScale().logicalToCoordinate(l):null}
function xToTime(x){return chart?chart.timeScale().coordinateToLogical(x):null}

/* ================================================================
   CANVAS
   ================================================================ */
var canvas,ctx;
function initCanvas(){canvas=document.getElementById('draw-canvas');ctx=canvas.getContext('2d');resizeCanvas()}
function resizeCanvas(){if(!canvas)return;canvas.width=window.innerWidth;canvas.height=window.innerHeight;renderAll()}

/* ================================================================
   DRAWING STATE
   ================================================================ */
var drawMode='none';
var drawings=[];
var currentDraw=null;
var selectedIdx=-1;
var dragOffset=null;
var limitOrders={};
var dragLimit=null;

function setDrawMode(m){
  drawMode=m;selectedIdx=-1;currentDraw=null;dragOffset=null;
  document.querySelectorAll('#toolbar button[id]').forEach(function(b){b.classList.remove('active')});
  var btn=document.getElementById('tb-'+m);if(btn)btn.classList.add('active');
  canvas.style.pointerEvents=(m==='none')?'none':'auto';
  if(m==='none')chart.applyOptions({handleScroll:true,handleScale:true});
}
function clearDrawings(){drawings=[];selectedIdx=-1;renderAll()}
function undoDrawing(){if(drawings.length){drawings.pop();selectedIdx=-1;renderAll()}}

/* ================================================================
   LIMIT ORDERS
   ================================================================ */
function addLimitOrder(id,price,dir,color){limitOrders[id]={price:price,direction:dir,color:color||'#FFD700'};renderAll()}
function removeLimitOrder(id){delete limitOrders[id];renderAll()}
function updateLimitPrice(id,p){if(limitOrders[id]){limitOrders[id].price=p;renderAll()}}
function removeAllLimitOrders(){limitOrders={};renderAll()}

/* ================================================================
   TRADE PROTECTION LINES (SL / TP / Entry)
   ================================================================ */
var tradeLines={};
var dragTradeLine=null;

function addTradeLine(id,price,lineType,color){
  tradeLines[id]={price:price,lineType:lineType,color:color||'#FFD700'};renderAll()
}
function removeTradeLine(id){delete tradeLines[id];renderAll()}
function updateTradeLinePrice(id,p){if(tradeLines[id]){tradeLines[id].price=p;renderAll()}}
function removeAllTradeLines(){tradeLines={};renderAll()}

function renderTradeLines(){
  for(var id in tradeLines){
    var tl=tradeLines[id],y=priceToY(tl.price);
    if(y===null||y<0||y>canvas.height)continue;
    ctx.save();
    ctx.strokeStyle=tl.color;ctx.lineWidth=2;
    if(tl.lineType==='entry'){ctx.setLineDash([4,4])}
    else if(tl.lineType==='stop_loss'){ctx.setLineDash([6,3])}
    else if(tl.lineType==='take_profit'){ctx.setLineDash([6,3])}
    else{ctx.setLineDash([8,4])}
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();
    ctx.setLineDash([]);
    var label='';
    if(tl.lineType==='stop_loss') label='SL '+tl.price.toFixed(2);
    else if(tl.lineType==='take_profit') label='TP '+tl.price.toFixed(2);
    else if(tl.lineType==='entry') label='Entry '+tl.price.toFixed(2);
    else label=id+' '+tl.price.toFixed(2);
    ctx.fillStyle=tl.color;ctx.font='14px sans-serif';
    var tw=ctx.measureText(label).width;
    ctx.fillRect(canvas.width-tw-16,y-18,tw+12,20);
    ctx.fillStyle='#1e222d';ctx.fillText(label,canvas.width-tw-10,y-4);
    if(tl.lineType!=='entry'){
      ctx.fillStyle=tl.color;ctx.fillRect(4,y-8,24,16);
      ctx.fillStyle='#1e222d';ctx.font='13px sans-serif';ctx.fillText('≡',8,y+4);
    }
    ctx.restore();
  }
}
function findTradeLineNear(y){
  for(var id in tradeLines){
    if(tradeLines[id].lineType==='entry')continue;
    var ly=priceToY(tradeLines[id].price);
    if(ly!=null&&Math.abs(ly-y)<10)return id;
  }
  return null;
}

/* ================================================================
   SCREENSHOT (render specific bar range)
   ================================================================ */
var _snapshotOverlays=[];
function addSnapshotOverlay(entryTime,entryPrice,exitTime,exitPrice,slPrice,tpPrice,isLong){
  _snapshotOverlays.push({et:entryTime,ep:entryPrice,xt:exitTime,xp:exitPrice,sl:slPrice,tp:tpPrice,long:isLong});
}
function clearSnapshotOverlays(){_snapshotOverlays=[];}
function renderSnapshotOverlays(){
  if(!ctx||!canvas||!_snapshotOverlays.length)return;
  for(var i=0;i<_snapshotOverlays.length;i++){
    var o=_snapshotOverlays[i];
    var x1=timeValToX(o.et),y1=priceToY(o.ep);
    var x2=timeValToX(o.xt),y2=priceToY(o.xp);
    if(x1==null||x2==null||y1==null||y2==null)continue;
    ctx.save();
    var win=(o.long?(o.xp>o.ep):(o.ep>o.xp));
    ctx.strokeStyle=win?'#26a69a':'#ef5350';
    ctx.lineWidth=2;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=o.long?'#ef5350':'#26a69a';
    ctx.beginPath();ctx.arc(x1,y1,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=win?'#26a69a':'#ef5350';
    ctx.beginPath();ctx.arc(x2,y2,5,0,Math.PI*2);ctx.fill();
    if(o.sl){
      var ysl=priceToY(o.sl);
      if(ysl!=null){
        ctx.strokeStyle='#ef535080';ctx.lineWidth=1;ctx.setLineDash([4,3]);
        ctx.beginPath();ctx.moveTo(x1,ysl);ctx.lineTo(x2,ysl);ctx.stroke();
        ctx.setLineDash([]);ctx.fillStyle='#ef5350';ctx.font='13px sans-serif';
        ctx.fillText('SL '+o.sl.toFixed(2),x1+4,ysl-3);
      }
    }
    if(o.tp){
      var ytp=priceToY(o.tp);
      if(ytp!=null){
        ctx.strokeStyle='#26a69a80';ctx.lineWidth=1;ctx.setLineDash([4,3]);
        ctx.beginPath();ctx.moveTo(x1,ytp);ctx.lineTo(x2,ytp);ctx.stroke();
        ctx.setLineDash([]);ctx.fillStyle='#26a69a';ctx.font='13px sans-serif';
        ctx.fillText('TP '+o.tp.toFixed(2),x1+4,ytp-3);
      }
    }
    ctx.restore();
  }
}
function timeValToX(tv){
  if(!chart||!candleSeries)return null;
  var tc=chart.timeScale().timeToCoordinate(tv);
  return(tc!=null&&!isNaN(tc))?tc:null;
}
function takeSnapshot(startIdx,endIdx,markers){
  if(!chart||!candleSeries)return '';
  chart.timeScale().setVisibleLogicalRange({from:startIdx-5,to:endIdx+5});
  if(markers&&markers.length)candleSeries.setMarkers(markers);
  return 'ready';
}
function getChartImage(){
  var el=document.getElementById('chart');
  var cvs=el.querySelector('canvas');
  if(!cvs)return '';
  renderSnapshotOverlays();
  var merged=document.createElement('canvas');
  var w=cvs.width,h=cvs.height;
  merged.width=w;merged.height=h;
  var mctx=merged.getContext('2d');
  var canvases=el.querySelectorAll('canvas');
  for(var i=0;i<canvases.length;i++){mctx.drawImage(canvases[i],0,0)}
  if(canvas&&ctx){mctx.drawImage(canvas,0,0)}
  clearSnapshotOverlays();
  renderAll();
  return merged.toDataURL('image/png');
}

/* ================================================================
   RENDER
   ================================================================ */
function renderAll(){
  if(!ctx||!canvas)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  renderLimitOrders();
  renderTradeLines();
  for(var i=0;i<drawings.length;i++) renderOne(drawings[i],i===selectedIdx);
  if(currentDraw)renderOne(currentDraw,false,true);
}

function renderLimitOrders(){
  for(var id in limitOrders){
    var lo=limitOrders[id],y=priceToY(lo.price);
    if(y===null||y<0||y>canvas.height)continue;
    ctx.save();ctx.strokeStyle=lo.color;ctx.lineWidth=2;ctx.setLineDash([8,4]);
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();
    ctx.setLineDash([]);ctx.fillStyle=lo.color;ctx.font='14px sans-serif';
    var lb=(lo.direction==='long'?'BUY':'SELL')+' @ '+lo.price.toFixed(2);
    ctx.fillRect(4,y-18,ctx.measureText(lb).width+10,20);
    ctx.fillStyle='#1e222d';ctx.fillText(lb,8,y-4);
    ctx.fillStyle=lo.color;ctx.fillRect(canvas.width-28,y-8,24,16);
    ctx.fillStyle='#1e222d';ctx.font='13px sans-serif';ctx.fillText('≡',canvas.width-24,y+4);
    ctx.restore();
  }
}

function renderOne(d,isSel,isPrev){
  ctx.save();
  ctx.globalAlpha=isPrev?0.6:1;
  if(isSel){ctx.shadowColor='#7b7bff';ctx.shadowBlur=6;}

  if(d.type==='hline'){
    var y=priceToY(d.price);
    if(y===null){ctx.restore();return}
    ctx.strokeStyle=d.color||'#e0e040';ctx.lineWidth=isSel?2.5:1.5;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();
    ctx.fillStyle=d.color||'#e0e040';ctx.font='14px sans-serif';
    ctx.fillText(d.price.toFixed(2),8,y-4);
  }
  else if(d.type==='rect'){
    var x1=timeToX(d.lx1),y1=priceToY(d.p1),x2=timeToX(d.lx2),y2=priceToY(d.p2);
    if(x1==null||x2==null||y1==null||y2==null){ctx.restore();return}
    ctx.strokeStyle='#5b9bd5';ctx.lineWidth=1.5;ctx.fillStyle='rgba(91,155,213,0.12)';
    var rx=Math.min(x1,x2),ry=Math.min(y1,y2),rw=Math.abs(x2-x1),rh=Math.abs(y2-y1);
    ctx.fillRect(rx,ry,rw,rh);ctx.strokeRect(rx,ry,rw,rh);
  }
  else if(d.type==='rr'){
    renderRR(d);
  }
  else if(d.type==='channel'){
    renderChannel(d,isSel);
  }
  ctx.restore();
}

function renderRR(d){
  var eY=priceToY(d.entry),sY=priceToY(d.sl);
  if(eY==null||sY==null)return;
  var risk=Math.abs(d.entry-d.sl);if(risk===0)return;
  var isL=d.entry>d.sl;
  var tps=[1,2,3].map(function(n){return isL?d.entry+risk*n:d.entry-risk*n});
  var L=50,R=canvas.width-50;
  ctx.fillStyle='rgba(239,83,80,0.15)';
  ctx.fillRect(L,Math.min(eY,sY),R-L,Math.abs(sY-eY));
  ctx.fillStyle='rgba(38,166,154,0.08)';
  var tp1Y=priceToY(tps[0]);
  if(tp1Y!=null)ctx.fillRect(L,Math.min(eY,tp1Y),R-L,Math.abs(tp1Y-eY));
  ctx.strokeStyle='#FFD700';ctx.lineWidth=1.5;ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(L,eY);ctx.lineTo(R,eY);ctx.stroke();
  ctx.strokeStyle='#ef5350';ctx.setLineDash([6,3]);
  ctx.beginPath();ctx.moveTo(L,sY);ctx.lineTo(R,sY);ctx.stroke();
  ctx.strokeStyle='#26a69a';
  for(var i=0;i<tps.length;i++){
    var ty=priceToY(tps[i]);if(ty==null||ty<0||ty>canvas.height)continue;
    ctx.beginPath();ctx.moveTo(L,ty);ctx.lineTo(R,ty);ctx.stroke();
    ctx.setLineDash([]);ctx.fillStyle='#26a69a';ctx.font='14px sans-serif';
    ctx.fillText((i+1)+'R '+tps[i].toFixed(2),R+4,ty+4);ctx.setLineDash([6,3]);
  }
  ctx.setLineDash([]);ctx.font='15px sans-serif';
  ctx.fillStyle='#FFD700';ctx.fillText('Entry '+d.entry.toFixed(2),L+4,eY-4);
  ctx.fillStyle='#ef5350';ctx.fillText('SL '+d.sl.toFixed(2)+' (Risk:'+risk.toFixed(2)+')',L+4,sY+(isL?16:-4));
}

function renderChannel(d,isSel){
  var x1=timeToX(d.lx1),y1=priceToY(d.p1),x2=timeToX(d.lx2),y2=priceToY(d.p2);
  if(x1==null||x2==null||y1==null||y2==null)return;
  var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
  if(len<2)return;
  var nx=-dy/len,ny=dx/len;
  var w=d.width||40;
  ctx.strokeStyle='#b39ddb';ctx.lineWidth=1.5;ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.setLineDash([5,3]);
  ctx.beginPath();ctx.moveTo(x1+nx*w,y1+ny*w);ctx.lineTo(x2+nx*w,y2+ny*w);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x1-nx*w,y1-ny*w);ctx.lineTo(x2-nx*w,y2-ny*w);ctx.stroke();
  ctx.fillStyle='rgba(179,157,219,0.08)';
  ctx.beginPath();
  ctx.moveTo(x1+nx*w,y1+ny*w);ctx.lineTo(x2+nx*w,y2+ny*w);
  ctx.lineTo(x2-nx*w,y2-ny*w);ctx.lineTo(x1-nx*w,y1-ny*w);
  ctx.closePath();ctx.fill();
  if(isSel){
    ctx.setLineDash([]);ctx.fillStyle='#b39ddb';ctx.font='13px sans-serif';
    var mx=(x1+x2)/2,my=(y1+y2)/2;
    ctx.fillText('宽:'+w+'px',mx+4,my-6);
  }
}

/* ================================================================
   HIT TEST & DRAG
   ================================================================ */
function hitTest(x,y){
  for(var i=drawings.length-1;i>=0;i--){
    var d=drawings[i];
    if(d.type==='hline'){
      var hy=priceToY(d.price);if(hy!=null&&Math.abs(hy-y)<8)return i;
    }else if(d.type==='rect'){
      var x1=timeToX(d.lx1),y1=priceToY(d.p1),x2=timeToX(d.lx2),y2=priceToY(d.p2);
      if(x1!=null&&x2!=null&&y1!=null&&y2!=null){
        var rx=Math.min(x1,x2)-5,ry=Math.min(y1,y2)-5;
        var rw=Math.abs(x2-x1)+10,rh=Math.abs(y2-y1)+10;
        if(x>=rx&&x<=rx+rw&&y>=ry&&y<=ry+rh)return i;
      }
    }else if(d.type==='rr'){
      var eY=priceToY(d.entry),sY=priceToY(d.sl);
      if(eY!=null&&Math.abs(eY-y)<8)return i;
      if(sY!=null&&Math.abs(sY-y)<8)return i;
    }else if(d.type==='channel'){
      var cx1=timeToX(d.lx1),cy1=priceToY(d.p1),cx2=timeToX(d.lx2),cy2=priceToY(d.p2);
      if(cx1!=null&&cx2!=null&&cy1!=null&&cy2!=null){
        if(distToSeg(x,y,cx1,cy1,cx2,cy2)<12)return i;
        var ddx=cx2-cx1,ddy=cy2-cy1,dlen=Math.sqrt(ddx*ddx+ddy*ddy);
        if(dlen>2){
          var nnx=-ddy/dlen,nny=ddx/dlen,ww=d.width||40;
          if(distToSeg(x,y,cx1+nnx*ww,cy1+nny*ww,cx2+nnx*ww,cy2+nny*ww)<10)return i;
          if(distToSeg(x,y,cx1-nnx*ww,cy1-nny*ww,cx2-nnx*ww,cy2-nny*ww)<10)return i;
        }
      }
    }
  }
  return -1;
}
function distToSeg(px,py,ax,ay,bx,by){
  var dx=bx-ax,dy=by-ay,t=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy);
  t=Math.max(0,Math.min(1,t));
  var cx=ax+t*dx,cy=ay+t*dy;
  return Math.sqrt((px-cx)*(px-cx)+(py-cy)*(py-cy));
}
function hitChannelEdge(x,y){
  for(var i=drawings.length-1;i>=0;i--){
    var d=drawings[i];if(d.type!=='channel')continue;
    var cx1=timeToX(d.lx1),cy1=priceToY(d.p1),cx2=timeToX(d.lx2),cy2=priceToY(d.p2);
    if(cx1==null||cx2==null||cy1==null||cy2==null)continue;
    var ddx=cx2-cx1,ddy=cy2-cy1,dlen=Math.sqrt(ddx*ddx+ddy*ddy);
    if(dlen<2)continue;
    var nnx=-ddy/dlen,nny=ddx/dlen,ww=d.width||40;
    if(distToSeg(x,y,cx1+nnx*ww,cy1+nny*ww,cx2+nnx*ww,cy2+nny*ww)<10)return{idx:i,sign:1};
    if(distToSeg(x,y,cx1-nnx*ww,cy1-nny*ww,cx2-nnx*ww,cy2-nny*ww)<10)return{idx:i,sign:-1};
  }
  return null;
}
function perpDistToLine(px,py,x1,y1,x2,y2){
  var ddx=x2-x1,ddy=y2-y1,dlen=Math.sqrt(ddx*ddx+ddy*ddy);
  if(dlen<1)return 0;
  return Math.abs((ddy*px-ddx*py+x2*y1-y2*x1)/dlen);
}
function findLimitNear(y){
  for(var id in limitOrders){var ly=priceToY(limitOrders[id].price);if(ly!=null&&Math.abs(ly-y)<10)return id}
  return null;
}

/* ================================================================
   MOUSE
   ================================================================ */
var mouseDown=false,startX=0,startY=0,startPrice=0;
var channelEdgeDrag=null;

function gmp(e){var r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}

document.getElementById('container').addEventListener('mousedown',function(e){
  if(e.button===2){
    e.preventDefault();
    var pos=gmp(e),hi=hitTest(pos.x,pos.y);
    if(hi>=0){drawings.splice(hi,1);selectedIdx=-1;renderAll()}
    return;
  }
  var pos=gmp(e);

  var loId=findLimitNear(pos.y);
  if(loId&&drawMode==='none'){
    dragLimit=loId;canvas.style.pointerEvents='auto';
    chart.applyOptions({handleScroll:false,handleScale:false});
    e.preventDefault();return;
  }
  var tlId=findTradeLineNear(pos.y);
  if(tlId&&drawMode==='none'){
    dragTradeLine=tlId;canvas.style.pointerEvents='auto';
    chart.applyOptions({handleScroll:false,handleScale:false});
    e.preventDefault();return;
  }

  if(drawMode==='none'){
    var edgeHit=hitChannelEdge(pos.x,pos.y);
    if(edgeHit){
      channelEdgeDrag=edgeHit;selectedIdx=edgeHit.idx;
      canvas.style.pointerEvents='auto';
      chart.applyOptions({handleScroll:false,handleScale:false});
      mouseDown=true;renderAll();e.preventDefault();return;
    }
    var hi=hitTest(pos.x,pos.y);
    if(hi>=0){
      selectedIdx=hi;
      startPrice=yToPrice(pos.y)||0;
      startX=pos.x;startY=pos.y;
      dragOffset={origDraw:JSON.parse(JSON.stringify(drawings[hi]))};
      canvas.style.pointerEvents='auto';
      chart.applyOptions({handleScroll:false,handleScale:false});
      mouseDown=true;renderAll();
      e.preventDefault();return;
    }
    canvas.style.pointerEvents='none';return;
  }

  mouseDown=true;startX=pos.x;startY=pos.y;
  var lx=xToTime(pos.x),pr=yToPrice(pos.y);
  if(lx==null||pr==null)return;
  chart.applyOptions({handleScroll:false,handleScale:false});

  if(drawMode==='hline'){
    drawings.push({type:'hline',price:Math.round(pr*100)/100,color:'#e0e040'});
    mouseDown=false;
    chart.applyOptions({handleScroll:true,handleScale:true});
    renderAll();return;
  }
  if(drawMode==='rect') currentDraw={type:'rect',lx1:lx,p1:pr,lx2:lx,p2:pr};
  else if(drawMode==='rr') currentDraw={type:'rr',entry:pr,sl:pr};
  else if(drawMode==='channel') currentDraw={type:'channel',lx1:lx,p1:pr,lx2:lx,p2:pr,width:40};
});

document.getElementById('container').addEventListener('mousemove',function(e){
  var pos=gmp(e);

  if(dragLimit){
    var np=yToPrice(pos.y);
    if(np!=null){limitOrders[dragLimit].price=Math.round(np*100)/100;renderAll();
      if(bridge)bridge.onLimitPriceMoved(dragLimit,limitOrders[dragLimit].price)}
    return;
  }
  if(dragTradeLine){
    var np=yToPrice(pos.y);
    if(np!=null){tradeLines[dragTradeLine].price=Math.round(np*100)/100;renderAll();
      if(bridge)bridge.onTradeLineMoved(dragTradeLine,tradeLines[dragTradeLine].price)}
    return;
  }

  if(drawMode==='none'&&!mouseDown){
    var nearLo=findLimitNear(pos.y);
    var nearTl=findTradeLineNear(pos.y);
    var nearEdge=hitChannelEdge(pos.x,pos.y);
    var nearDr=hitTest(pos.x,pos.y);
    if(nearLo||nearTl){canvas.style.pointerEvents='auto';canvas.style.cursor='ns-resize'}
    else if(nearEdge){canvas.style.pointerEvents='auto';canvas.style.cursor='ew-resize'}
    else if(nearDr>=0){canvas.style.pointerEvents='auto';canvas.style.cursor='grab'}
    else{canvas.style.pointerEvents='none';canvas.style.cursor='default'}
    return;
  }

  if(drawMode==='none'&&mouseDown&&channelEdgeDrag){
    var cd=drawings[channelEdgeDrag.idx];
    var cx1=timeToX(cd.lx1),cy1=priceToY(cd.p1),cx2=timeToX(cd.lx2),cy2=priceToY(cd.p2);
    if(cx1!=null&&cy1!=null&&cx2!=null&&cy2!=null){
      cd.width=Math.max(5,Math.round(perpDistToLine(pos.x,pos.y,cx1,cy1,cx2,cy2)));
    }
    renderAll();return;
  }

  if(drawMode==='none'&&mouseDown&&selectedIdx>=0&&dragOffset){
    var dy=pos.y-startY;
    var origD=dragOffset.origDraw,d=drawings[selectedIdx];
    var priceDelta=(yToPrice(pos.y)||0)-startPrice;
    if(d.type==='hline') d.price=origD.price+priceDelta;
    else if(d.type==='rect'){
      d.p1=origD.p1+priceDelta;d.p2=origD.p2+priceDelta;
      var lxDelta=xToTime(pos.x)-xToTime(startX);
      d.lx1=origD.lx1+(lxDelta||0);d.lx2=origD.lx2+(lxDelta||0);
    }
    else if(d.type==='rr'){d.entry=origD.entry+priceDelta;d.sl=origD.sl+priceDelta}
    else if(d.type==='channel'){
      d.p1=origD.p1+priceDelta;d.p2=origD.p2+priceDelta;
      var lxD=xToTime(pos.x)-xToTime(startX);
      d.lx1=origD.lx1+(lxD||0);d.lx2=origD.lx2+(lxD||0);
    }
    renderAll();return;
  }

  if(!mouseDown||!currentDraw)return;
  var lx=xToTime(pos.x),pr=yToPrice(pos.y);if(lx==null||pr==null)return;
  if(currentDraw.type==='rect'){currentDraw.lx2=lx;currentDraw.p2=pr}
  else if(currentDraw.type==='rr'){currentDraw.sl=pr}
  else if(currentDraw.type==='channel'){currentDraw.lx2=lx;currentDraw.p2=pr}
  renderAll();
});

document.getElementById('container').addEventListener('mouseup',function(e){
  if(dragLimit){
    if(bridge)bridge.onLimitPriceMoved(dragLimit,limitOrders[dragLimit].price);
    dragLimit=null;
    if(drawMode==='none'){canvas.style.pointerEvents='none';chart.applyOptions({handleScroll:true,handleScale:true})}
    return;
  }
  if(dragTradeLine){
    if(bridge)bridge.onTradeLineMoved(dragTradeLine,tradeLines[dragTradeLine].price);
    dragTradeLine=null;
    if(drawMode==='none'){canvas.style.pointerEvents='none';chart.applyOptions({handleScroll:true,handleScale:true})}
    return;
  }
  if(drawMode==='none'&&mouseDown&&(selectedIdx>=0||channelEdgeDrag)){
    mouseDown=false;selectedIdx=-1;dragOffset=null;channelEdgeDrag=null;
    chart.applyOptions({handleScroll:true,handleScale:true});
    canvas.style.pointerEvents='none';renderAll();return;
  }
  if(!mouseDown)return;
  mouseDown=false;chart.applyOptions({handleScroll:true,handleScale:true});
  if(currentDraw){drawings.push(currentDraw);currentDraw=null}
  renderAll();
});

document.getElementById('container').addEventListener('contextmenu',function(e){e.preventDefault()});

document.getElementById('container').addEventListener('wheel',function(e){
  var pos=gmp(e),hi=hitTest(pos.x,pos.y);
  if(hi>=0&&drawings[hi].type==='channel'){
    drawings[hi].width=Math.max(5,drawings[hi].width+(e.deltaY>0?-5:5));
    renderAll();e.preventDefault();
  }
},{passive:false});

/* ================================================================
   INIT
   ================================================================ */
initCanvas();
window.addEventListener('resize',function(){
  if(chart)chart.applyOptions({width:window.innerWidth,height:window.innerHeight});
  resizeCanvas();
});
</script>
